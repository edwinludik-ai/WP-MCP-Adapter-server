name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4'] # 7.4 is the plugin's minimum
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit checks (key hashing, header parsing, IP/CIDR matching)
        run: php tests/check.php

  standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install PHPCS with the WordPress and PHP-compatibility rulesets
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs:^3 phpcompatibility/phpcompatibility-wp dealerdirect/phpcodesniffer-composer-installer
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"
      - name: PHPCS (rules in .phpcs.xml.dist)
        run: phpcs

  build:
    name: Build plugin zip
    needs: [test, standards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-api-keys
          path: dist/mcp-api-keys.zip
          if-no-files-found: error

  smoke:
    name: Smoke test the zip on WordPress
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: mcp-api-keys
          path: dist
      - name: Unpack the built zip
        run: unzip -q dist/mcp-api-keys.zip -d pkg
      - name: Start WordPress (Playground) with the unpacked plugin and the MCP Adapter
        run: |
          nohup npx -y @wp-playground/cli@3.1.62 server \
            --blueprint=tests/blueprint.json --auto-mount="$PWD/pkg/mcp-api-keys" --login --port=9400 \
            > playground.log 2>&1 &
          for _ in $(seq 1 100); do
            grep -q 'Ready!' playground.log && exit 0
            sleep 3
          done
          cat playground.log
          exit 1
      - name: Smoke test
        run: python3 tests/smoke.py
      - name: Playground log
        if: failure()
        run: cat playground.log

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: mcp-api-keys
          path: dist
      - name: Tag must match the plugin header version
        run: |
          version=$(sed -n 's/^ \* Version: *//p' mcp-api-keys.php | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin's Version: $version"
            exit 1
          fi
      - name: Create the GitHub release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mcp-api-keys.zip --title "$GITHUB_REF_NAME" --generate-notes

  wporg:
    name: Deploy to WordPress.org
    # Off until the plugin is approved on WordPress.org. Then create the environment "wordpress-org" with a required
    # reviewer, put the secrets SVN_USERNAME and SVN_PASSWORD in it, and set the repository variable WPORG_DEPLOY=true
    # (Settings > Environments, and Settings > Secrets and variables > Actions > Variables).
    if: startsWith(github.ref, 'refs/tags/v') && vars.WPORG_DEPLOY == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: wordpress-org # the reviewer approves each deploy before the secrets are released
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-api-keys
          path: dist
      - name: Unpack the released zip
        run: unzip -q dist/mcp-api-keys.zip -d pkg
      - name: readme.txt must name a real WordPress.org contributor
        run: "! grep -q REPLACE_WITH_WPORG_USERNAME pkg/mcp-api-keys/readme.txt"
      - name: Commit to the WordPress.org SVN repository (trunk and a tag)
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0 (pinned to the commit; Dependabot bumps it)
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mcp-api-keys
          BUILD_DIR: pkg/mcp-api-keys
